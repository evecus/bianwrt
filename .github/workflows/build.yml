name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  BIN_NAME: bianwrt-server
  APP_NAME: bianwrt

jobs:
  build:
    strategy:
      matrix:
        include:
          # GitHub 官方免费 arm64 runner（公开仓库免费），原生编译无需 QEMU/cross
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile || pnpm install --no-fund --no-audit
          pnpm build
        # 顺序很重要：前端产物在 cargo build 时被 rust-embed 内嵌进二进制

      - name: Build backend (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: target/${{ matrix.target }}/release/bianwrt-server
