[package]
name = "bianwrt-server"
version = "0.1.0"
edition = "2021"
description = "OpenWrt-like management panel for Debian/Ubuntu servers"

[[bin]]
name = "bianwrt-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
tar = "0.4"
flate2 = "1"
toml = "0.8"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 2
lto = true
